# Конфигурация микросервиса «Господдержка СВО».
# Скопируйте файл в config.yaml и заполните реальными значениями.
# Путь к конфигу: ./config.yaml или переменная окружения CONFIG_PATH.

server:
  host: "0.0.0.0"
  port: 8080
  # ключ заголовка X-Api-Key для /excel/extract (тот же прописывается в Dify HTTP-узле)
  api_key: "112233"

excel:
  # лимит символов на извлечённый текст таблицы (~2 символа кириллицы на токен)
  max_chars: 60000
  # пустые ячейки выбрасываем — таблица разрежена, это сильно экономит токены
  drop_empty_cells: true

dify:
  # база API Dify, без завершающего слэша
  base_url: "https://dify.t1v.scibox.tech/v1"
  # ключ приложения MAX-ветки (вкладка API Access, формат app-...)
  max_app_key: "app-xxxxxxxxxxxxxxxx"
  # единый ассистент документов: чтение/извлечение полей/перевод подписей/распознавание.
  # Если задан — используется для всех документных сценариев бота;
  # пусто — старая логика (doc_vision_app_key / vision.provider)
  documents_app_key: "app-xxxxxxxxxxxxxxxx"
  # старый воркфлоу распознавания ЖКУ; нужен только если documents_app_key пуст
  doc_vision_app_key: "app-xxxxxxxxxxxxxxxx"
  # ассистент, который заполняет заявление и собирает .docx; пусто — файл соберётся в коде
  doc_fill_app_key: "app-xxxxxxxxxxxxxxxx"
  # нормализация «Истории взаимодействия» в события; пусто — офлайн-нормализатор
  history_app_key: "app-xxxxxxxxxxxxxxxx"
  # подбор меры поддержки по описанию ситуации; пусто — офлайн-подбор по ключевым словам
  measure_app_key: "app-xxxxxxxxxxxxxxxx"
  # каталог для загруженных через кабинет DOCX-шаблонов мер
  measure_templates_dir: "./data/measure_templates"
  # шаблон заявления; загружается в Dify в переменную template узла Start
  doc_template_path: "./data/Zayavlenie_Shablon.docx"

  # старый провайдер визуальной модели, работает только когда documents_app_key пуст:
  # dify — воркфлоу doc_vision_app_key; openrouter — прямой вызов vision-модели
  vision:
    provider: "dify"  # dify | openrouter
    # OpenAI-compatible endpoint, можно заменить на свой gateway
    openrouter_base_url: "https://openrouter.ai/api/v1"
    openrouter_api_key: "sk-or-xxxxxxxxxxxxxxxx"
    # модель с поддержкой vision, напр. google/gemini-2.5-flash
    openrouter_model: "google/gemini-2.5-flash"
    temperature: 0.1
    timeout: 90

  # база знаний: сюда пишутся ответы операторов и автоматически выгружаются меры
  # поддержки; она же используется для ответов на вопросы и подбора меры.
  # Достаточно заполнить api_key и dataset_id — синхронизация включится сама.
  dataset:
    # ключ Knowledge/Dataset API (формат dataset-...)
    api_key: "dataset-xxxxxxxxxxxxxxxx"
    # ID датасета (виден в URL базы знаний в Dify)
    dataset_id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

  # отдельный ассистент и база знаний для раздела «Чат с ИИ» по карточкам УСВО
  usvo_ai:
    app_key: "app-xxxxxxxxxxxxxxxx"               # ключ самого чата
    # планировщик фильтра: вопрос -> JSON-фильтр, исполняется в SQLite-индексе карточек;
    # пусто — офлайн-эвристика
    filter_app_key: "app-xxxxxxxxxxxxxxxx"
    # производный SQLite-индекс карточек, пересобирается сам
    usvo_index_db: "./data/usvo_index.db"
    # устаревший планировщик, используется только если filter_app_key пуст
    planner_app_key: ""
    # временный режим: чат подаёт модели сразу все карточки, без базы знаний и движка;
    # имеет приоритет над app_key, когда задан
    full_context_app_key: ""
    full_context_max_chars: 45000                 # лимит символов на блок всех карточек
    timeout: 90
    max_history_messages: 30
    auto_sync: true
    dataset:
      api_key: "dataset-xxxxxxxxxxxxxxxx"
      dataset_id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

max:
  # актуальная база API — platform-api.max.ru, авторизация заголовком Authorization
  api_base_url: "https://platform-api.max.ru"
  # токен бота (выдаёт @MasterBot)
  bot_token: "xxxxxxxxxxxxxxxxxxxxxxxx"
  # ID чата операторов — сюда уходят эскалации и заявки на приём
  operator_chat_id: "-1001234567890"
  # после каждых N вопросов предлагаем записаться на приём
  questions_before_offer: 2
  # при confidence ниже порога или found_in_kb=false — эскалация оператору
  confidence_threshold: 0.6
  # порог фильтра «не по теме»: уверенный off-topic отклоняется и не идёт операторам
  topic_threshold: 0.5
  # long polling вместо вебхука (удобно локально); вместе с активной подпиской не включать
  polling: false

storage:
  # SQLite с состоянием бота; создаётся автоматически при первом запуске
  sqlite_path: "./data/state.db"

# Авторизация веб-кабинета. По умолчанию demo — вход по списку demo_users,
# без поднятого Kratos (реальный Kratos — deploy/kratos/docker-compose.yml).
auth:
  enabled: true
  # demo — по списку demo_users; kratos — через Identity API Kratos;
  # external — доступ проверяет внешний SSO/reverse proxy
  mode: "demo"
  external_name: "Пользователь платформы"
  external_role: "Оператор"
  kratos_public_url: "http://localhost:4433"
  # на проде сменить на длинную случайную строку (подпись cookie-сессии)
  session_secret: "change-me-please-set-a-long-random-secret"
  session_ttl_hours: 12
  # отдельная БД учёток сотрудников; их заводит админ в разделе «Настройки»
  employees_db: "./data/employees.db"
  # здесь только администраторы; сотрудников создаёт админ через «Настройки»
  demo_users:
    - identifier: "operator@mosreg.ru"
      password: "kontakt2026"
      name: "Иванова О. П."
      role: "Сотрудник"
    - identifier: "admin@mosreg.ru"
      password: "admin2026"
      name: "Петров С. А."
      role: "Администратор"

web:
  enabled: true
  title: "Контакт-центр — Господдержка СВО"
  # Excel-таблица УСВО — источник карточек и аналитики
  usvo_xlsx: "../USVO_tablitsa_1_plus_49_synthetic_rows_dates_addresses_fixed.xlsx"
  # текст базы знаний для офлайн-подсказок, когда Dify не настроен
  kb_text: "../Информация для базы знаний.txt"
  # без контакта дольше этого срока (дней) карточка подсвечивается в аналитике
  contact_stale_days: 90
  # регламентный срок обработки обращения, календарных дней; это дефолт —
  # администратор может переопределить его в кабинете («Настройки» -> «Регламент»)
  sla_business_days: 3
  # напоминания операторам о просрочке (фоновая задача, нужен рабочий бот);
  # по умолчанию выключено, интервал проверки в минутах
  sla_reminders_enabled: false
  sla_reminder_interval_minutes: 60
  # операторы для назначения ответственного по обращению
  operators:
    - "Иванова О. П."
    - "Петров С. А."
    - "Сидорова М. В."
  # ИИ для черновиков ответа; не связан с MAX-веткой выше
  ai:
    provider: "local"  # local | dify | openai_compatible
    # вариант 1: отдельное Dify-приложение (простой Chat/LLM)
    dify_base_url: "https://dify.t1v.scibox.tech/v1"
    dify_app_key: ""
    # auto: сначала /chat-messages, потом /completion-messages
    dify_mode: "auto"
    # имя input-переменной completion-приложения
    dify_input_variable: "query"
    # вариант 2: модель напрямую через {openai_base_url}/chat/completions
    openai_base_url: ""
    openai_api_key: ""
    openai_model: ""
    temperature: 0.2
    timeout: 60
  # если реальных обращений ещё нет — показать синтетические из таблицы УСВО
  seed_appeals: true

# человекочитаемый файл со зданиями и слотами записи; перечитывается на каждый запрос
schedule_file: "./data/schedule.yaml"

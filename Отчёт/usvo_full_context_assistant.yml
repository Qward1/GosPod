app:
  description: 'ВРЕМЕННОЕ решение для раздела «Чат с ИИ» веб-кабинета «Контакт-центр».
    В отличие от usvo_chat_assistant.yml здесь НЕТ узла knowledge-retrieval: микросервис
    подаёт в контекст модели СРАЗУ ВСЕ текущие карточки УСВО (целиком, без RAG/top-k)
    плюс вопрос пользователя, историю диалога, мета-информацию и инструкцию формата.
    Всё приходит уже собранным в поле query (см. app/web/ai_chat.py, режим full_context).
    Подключается как dify.usvo_ai.full_context_app_key (вызывается ask_text → /chat-messages).
    Модель отвечает обычным текстом: считает, агрегирует и перечисляет людей с полным ФИО
    (по ФИО микросервис строит гиперссылку на карточку /usvo/cards/<id>). Работает, пока
    карточек немного и они влезают в окно модели (≈32k токенов). Когда карточек станет
    много — переключиться обратно на usvo_chat_assistant.yml (RAG + детерминированный движок).
    См. CLAUDE.md, USVO_CHAT_PROMPT.md.'
  icon: 🗂️
  icon_background: '#EFF6FF'
  mode: advanced-chat
  name: Чат с ИИ по карточкам УСВО — полный контекст (Господдержка СВО)
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: package
  value:
    plugin_unique_identifier: langgenius/openai_api_compatible:0.0.35@bb81bce2b7e04af8178eb2fb36cc6e1eb75aadbc98d31bc2c858b4648ba63c26
    version: null
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start_node-source-chat_llm-target
      source: start_node
      sourceHandle: source
      target: chat_llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: chat_llm-source-answer_node-target
      source: chat_llm
      sourceHandle: source
      target: answer_node
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 'На вход — собранный микросервисом запрос (sys.query): текущий вопрос + история
          диалога + мета-информация + ПОЛНЫЙ список всех карточек УСВО + системная инструкция
          + инструкция формата. Передаёт app/web/ai_chat.py через ask_text. Доп. input-переменные
          не нужны, базы знаний нет.'
        selected: false
        title: Start
        type: start
        variables: []
      height: 90
      id: start_node
      position: {x: 80, y: 282}
      positionAbsolute: {x: 80, y: 282}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 'Отвечает на вопрос по карточкам УСВО. Все данные (вопрос, история, мета,
          ПОЛНЫЙ список всех карточек, инструкция формата) уже внутри sys.query. Базы знаний
          нет — модель работает только по переданному тексту.'
        model:
          completion_params: {temperature: 0.2}
          mode: chat
          name: qwen3-32b-fp8-v2
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: chat-sys
          role: system
          text: |
            Ты ассистент, который отвечает на вопросы сотрудников контакт-центра по базе карточек УСВО (участников СВО).

            ВАЖНО: полный список ВСЕХ текущих карточек УСВО передан прямо в запросе пользователя (блок «Полная база карточек УСВО»). Базы знаний/поиска нет — отвечай ТОЛЬКО по этим карточкам, мета-информации и истории диалога из запроса.

            ПРАВИЛА:
            1. Отвечай только на основе переданных данных. Если данных не хватает — прямо скажи, чего именно. Не выдумывай людей, статусы, награды или числа.
            2. Для статистических вопросов («сколько …») считай точно по всем переданным карточкам и приводи число.
            3. Для вопросов-перечислений и составных условий (например «у кого инвалидность И более двух детей») переби все карточки, отбери подходящие и перечисли их.
            4. Когда упоминаешь человека из карточек, ВСЕГДА пиши его полное ФИО как в карточке — по нему микросервис автоматически построит гиперссылку на карточку. Рядом коротко указывай релевантные для вопроса данные (статус, населённый пункт, награды, нужное поле).
            5. Если блок «Полная база карточек УСВО» помечен как усечённый по объёму — честно сообщи, что показаны не все карточки, и предложи уточнить вопрос.
            6. Не описывай в ответе, как именно ты считал (никаких «детерминированно», «перебрал карточки» и т. п.). Просто давай готовый ответ.
            7. Строго соблюдай выбранный формат ответа (текст / развернутая справка / краткая справка) и его шаблон — они переданы в запросе.
            8. Не добавляй markdown-обёртки и пояснения вне самого ответа.
        - id: chat-user
          role: user
          text: |
            {{#sys.query#}}
        selected: false
        title: Ответ по карточкам УСВО (LLM, полный контекст)
        type: llm
      height: 98
      id: chat_llm
      position: {x: 384, y: 282}
      positionAbsolute: {x: 384, y: 282}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#chat_llm.text#}}'
        desc: Возвращает текстовый ответ микросервису (ask_text → поле answer).
        selected: false
        title: Ответ
        type: answer
        variables: []
      height: 106
      id: answer_node
      position: {x: 688, y: 282}
      positionAbsolute: {x: 688, y: 282}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1

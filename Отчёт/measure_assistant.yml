app:
  description: 'Подбор меры поддержки участника СВО по описанию ситуации гражданина. На вход —
    свободный текст (sys.query), на выходе — строгий JSON {measure_id, measure_title, found,
    confidence}. Опирается на базу знаний с описанием активных мер поддержки (микросервис
    выгружает её через WebService.sync_measures_kb / dify_client.add_document_text). Подключается
    к микросервису как dify.measure_app_key (DocAI.select_measure). См. CLAUDE.md и PROMPTS.md.'
  icon: 🎯
  icon_background: '#E0F2FE'
  mode: advanced-chat
  name: Подбор меры поддержки (Господдержка СВО)
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: package
  value:
    plugin_unique_identifier: langgenius/openai_api_compatible:0.0.35@bb81bce2b7e04af8178eb2fb36cc6e1eb75aadbc98d31bc2c858b4648ba63c26
    version: null
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: knowledge-retrieval
      id: start_node-source-measures_kb-target
      source: start_node
      sourceHandle: source
      target: measures_kb
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: measures_kb-source-measure_llm-target
      source: measures_kb
      sourceHandle: source
      target: measure_llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: measure_llm-source-answer_node-target
      source: measure_llm
      sourceHandle: source
      target: answer_node
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 'На вход — свободное описание ситуации гражданина (sys.query). Передаёт микросервис
          (DocAI.select_measure).'
        selected: false
        title: Start
        type: start
        variables: []
      height: 90
      id: start_node
      position: {x: 80, y: 282}
      positionAbsolute: {x: 80, y: 282}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        dataset_ids:
        - REPLACE_WITH_MEASURES_DATASET_ID
        desc: 'ТА ЖЕ база знаний, что и для ответов на вопросы (dify.dataset). Микросервис
          автоматически выгружает в неё каждую активную меру отдельным документом «Мера
          поддержки #<id>: …» при создании/изменении в кабинете. Выберите здесь тот же датасет,
          что указан в dify.dataset.dataset_id.'
        multiple_retrieval_config:
          reranking_enable: false
          reranking_mode: weighted_score
          score_threshold: 0.2
          top_k: 6
          weights:
            keyword_setting:
              keyword_weight: 0.3
            vector_setting:
              embedding_model_name: bge-m3-v2
              embedding_provider_name: langgenius/openai_api_compatible/openai_api_compatible
              vector_weight: 0.7
            weight_type: customized
        query_variable_selector:
        - sys
        - query
        retrieval_mode: multiple
        selected: false
        title: Меры поддержки (база знаний)
        type: knowledge-retrieval
      height: 92
      id: measures_kb
      position: {x: 384, y: 282}
      positionAbsolute: {x: 384, y: 282}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: true
          variable_selector:
          - measures_kb
          - result
        desc: 'Выбирает наиболее подходящую меру поддержки из контекста и возвращает её id.'
        model:
          completion_params: {temperature: 0.1}
          mode: chat
          name: qwen3-32b-fp8-v2
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: measure-sys
          role: system
          text: |
            Ты помогаешь подобрать меру социальной поддержки участнику СВО или члену его семьи по описанию ситуации. Результат — строго JSON по схеме, без markdown и пояснений.

            Доступные меры поддержки берутся ТОЛЬКО из контекста (каждая мера имеет «id N» и название). Не выдумывай меры, которых нет в контексте.
            {{#context#}}

            ПРАВИЛА:
            1. Определи, какая мера из контекста лучше всего соответствует ситуации гражданина.
            2. measure_id — целое число, ровно как «id» выбранной меры из контекста. measure_title — её название.
            3. Если подходящей меры в контексте нет — верни found=false, measure_id=0, measure_title="".
            4. confidence — твоя уверенность в выборе (0..1).
            5. Никакого текста вне JSON.
        - id: measure-user
          role: user
          text: |
            Ситуация гражданина: {{#sys.query#}}

            Выбери подходящую меру поддержки и верни JSON {measure_id, measure_title, found, confidence}.
        selected: false
        structured_output:
          schema:
            type: object
            additionalProperties: false
            required:
            - measure_id
            - measure_title
            - found
            - confidence
            properties:
              measure_id:
                type: integer
                description: id выбранной меры из контекста; 0 если не найдена
              measure_title:
                type: string
              found:
                type: boolean
              confidence:
                type: number
        structured_output_enabled: true
        title: Подбор меры (LLM)
        type: llm
      height: 98
      id: measure_llm
      position: {x: 688, y: 282}
      positionAbsolute: {x: 688, y: 282}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#measure_llm.text#}}'
        desc: Возвращает JSON выбора меры микросервису (DocAI.select_measure).
        selected: false
        title: Ответ (JSON выбора меры)
        type: answer
        variables: []
      height: 106
      id: answer_node
      position: {x: 992, y: 282}
      positionAbsolute: {x: 992, y: 282}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1

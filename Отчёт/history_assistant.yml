app:
  description: 'Нормализатор «Истории взаимодействия» УСВО: превращает свободный текст из
    карточки участника СВО в структурированный JSON-список событий (kind/status/style/title/detail)
    для красивого вывода в веб-кабинете «Контакт-центр». Подключается к микросервису как
    dify.history_app_key. Модель опирается на базу знаний "data/history_styles.md" — подключите
    её в узле «Стили оформления (база знаний)». См. CLAUDE.md и data/history_styles.md.'
  icon: 🗂️
  icon_background: '#E0F2FE'
  mode: advanced-chat
  name: Нормализация истории взаимодействия (Господдержка СВО)
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: package
  value:
    plugin_unique_identifier: langgenius/openai_api_compatible:0.0.35@bb81bce2b7e04af8178eb2fb36cc6e1eb75aadbc98d31bc2c858b4648ba63c26
    version: null
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: knowledge-retrieval
      id: start_node-source-styles_kb-target
      source: start_node
      sourceHandle: source
      target: styles_kb
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: styles_kb-source-history_llm-target
      source: styles_kb
      sourceHandle: source
      target: history_llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: history_llm-source-answer_node-target
      source: history_llm
      sourceHandle: source
      target: answer_node
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 'На вход — свободный текст «Истории взаимодействия» из карточки УСВО (sys.query).
          Передаёт микросервис (history_ai.normalize_history).'
        selected: false
        title: Start
        type: start
        variables: []
      height: 90
      id: start_node
      position: {x: 80, y: 282}
      positionAbsolute: {x: 80, y: 282}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        dataset_ids:
        - REPLACE_WITH_HISTORY_STYLES_DATASET_ID
        desc: 'База знаний из data/history_styles.md (категории, статусы, стили). После импорта
          выберите датасет в этом узле заново.'
        multiple_retrieval_config:
          reranking_enable: false
          reranking_mode: weighted_score
          score_threshold: 0.2
          top_k: 4
          weights:
            keyword_setting:
              keyword_weight: 0.3
            vector_setting:
              embedding_model_name: bge-m3-v2
              embedding_provider_name: langgenius/openai_api_compatible/openai_api_compatible
              vector_weight: 0.7
            weight_type: customized
        query_variable_selector:
        - sys
        - query
        retrieval_mode: multiple
        selected: false
        title: Стили оформления (база знаний)
        type: knowledge-retrieval
      height: 92
      id: styles_kb
      position: {x: 384, y: 282}
      positionAbsolute: {x: 384, y: 282}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: true
          variable_selector:
          - styles_kb
          - result
        desc: 'Нормализует свободный текст истории в JSON {events:[…]} строго по справочнику стилей.'
        model:
          completion_params: {temperature: 0.1}
          mode: chat
          name: qwen3-32b-fp8-v2
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: hist-sys
          role: system
          text: |
            Ты нормализуешь свободный текст «Истории взаимодействия» с участником СВО в структурированный список событий для веб-кабинета. Результат — строго JSON по схеме, без markdown и пояснений.

            Используй справочник стилей из контекста (категории kind, статусы status, акценты style):
            {{#context#}}

            ПРАВИЛА:
            1. Разбей текст на ОТДЕЛЬНЫЕ события (по датам, переносам строк, точкам с запятой, смыслу). Одно действие = одно событие.
            2. kind — строго одна из категорий справочника: status, contact, doc, med, work, edu, org, family, housing, visit, appeal, award, info.
            3. status — строго одно из: «выполнено», «в работе», «запланировано».
            4. style — строго одно из: ok, accent, planned, warn, danger, info. По умолчанию ok→выполнено, accent→в работе, planned→запланировано. Если в тексте отказ/проблема/задолженность/просрочка/нарушение/жалоба — подними style до warn или danger.
            5. date — ДД.ММ.ГГГГ, если дата есть в тексте; иначе пустая строка.
            6. title — короткий человекочитаемый заголовок (до 8 слов). detail — аккуратно переформулированный фрагмент (1–2 предложения, грамотно).
            7. org — учреждение, если упомянуто, иначе пустая строка.
            8. Не выдумывай факты, которых нет в тексте. Только нормализуй и оформляй. Сохрани хронологический порядок (старые → новые).
        - id: hist-user
          role: user
          text: |
            Нормализуй следующий текст «Истории взаимодействия» в JSON {events:[…]}:

            {{#sys.query#}}
        selected: false
        structured_output:
          schema:
            type: object
            additionalProperties: false
            required:
            - events
            properties:
              events:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - date
                  - kind
                  - status
                  - style
                  - title
                  - detail
                  - org
                  properties:
                    date:
                      type: string
                      description: ДД.ММ.ГГГГ или пустая строка
                    kind:
                      type: string
                      enum: [status, contact, doc, med, work, edu, org, family, housing, visit, appeal, award, info]
                    status:
                      type: string
                      enum: ["выполнено", "в работе", "запланировано"]
                    style:
                      type: string
                      enum: [ok, accent, planned, warn, danger, info]
                    title:
                      type: string
                    detail:
                      type: string
                    org:
                      type: string
        structured_output_enabled: true
        title: Нормализация истории (LLM)
        type: llm
      height: 98
      id: history_llm
      position: {x: 688, y: 282}
      positionAbsolute: {x: 688, y: 282}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#history_llm.text#}}'
        desc: Возвращает JSON событий микросервису (history_ai.normalize_history).
        selected: false
        title: Ответ (JSON событий)
        type: answer
        variables: []
      height: 106
      id: answer_node
      position: {x: 992, y: 282}
      positionAbsolute: {x: 992, y: 282}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1

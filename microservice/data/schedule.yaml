    name: 'Филиал Госфонда «Защитники Отечества»'
    short: 'Госфонд'
    address: 'проспект Ленинского Комсомола, д. 6А'
    work_hours: 'Пн–Пт 09:00–18:00'
    slots: ["09:00", "10:00", "11:00", "12:00", "14:00", "15:00", "16:00", "17:00"]


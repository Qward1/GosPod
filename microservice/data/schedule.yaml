# ============================================================================
# Расписание административных зданий (приём по записи) и слоты времени.
#
# Этот файл задуман как ЧАСТО МЕНЯЕМЫЙ — правьте его вручную без изменения кода.
# Микросервис перечитывает файл на каждый запрос, перезапуск не нужен.
#
# Правила:
#   - buildings: список зданий. Каждое здание независимо.
#   - id        : короткий латинский идентификатор (используется в callback-кнопках).
#   - name      : отображаемое имя.
#   - short     : короткая подпись для текста кнопки (чтобы кнопка влезала).
#   - address   : адрес.
#   - work_hours: режим работы (показывается пользователю справочно).
#   - slots     : список слотов. Один слот = один час. Формат "ЧЧ:ММ".
#                 Пока показываем ВСЕ слоты (логика занятости не реализована).
# ============================================================================

buildings:

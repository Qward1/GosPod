# Конфигурация Ory Kratos для контакт-центра поддержки СВО.
# Минимальная самодостаточная конфигурация для self-hosted-запуска (SQLite).
# Микросервис ходит в Kratos через API login flow (mode: kratos в config.yaml),
# поэтому браузерные URL ниже нужны лишь для self-service страниц Kratos.

version: v1.1.0

dsn: sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:8080
      allowed_methods: [GET, POST, PUT, PATCH, DELETE]
      allowed_headers: [Authorization, Content-Type, X-Session-Token]
      exposed_headers: [Content-Type, Set-Cookie]
  admin:
    base_url: http://localhost:4434/

selfservice:
  default_browser_return_url: http://localhost:8080/
  allowed_return_urls:
    - http://localhost:8080/
  methods:
    password:
      enabled: true
  flows:
    error:
      ui_url: http://localhost:8080/login.html
    login:
      ui_url: http://localhost:8080/login.html
      lifespan: 10m
    logout:
      after:
        default_browser_return_url: http://localhost:8080/login.html
    settings:
      ui_url: http://localhost:8080/login.html
    registration:
      enabled: true
      ui_url: http://localhost:8080/login.html

session:
  lifespan: 12h

identity:
  default_schema_id: employee
  schemas:
    - id: employee
      url: file:///etc/config/kratos/identity.schema.json

secrets:
  cookie:
    - CHANGE-ME-32-byte-cookie-secret-xx
  cipher:
    - CHANGE-ME-32-byte-cipher-secret-xx

hashers:
  argon2:
    parallelism: 1
    memory: 128MB
    iterations: 2
    salt_length: 16
    key_length: 16

log:
  level: info
  format: text

# ============================================================================
# Рабочая конфигурация микросервиса «Господдержка СВО».
#
# Это ЕДИНСТВЕННЫЙ источник настроек (вместо запрещённого на сервере .env).
# Путь по умолчанию: ./config.yaml (переопределяется CONFIG_PATH).
#
# КАК ЗАПОЛНЯТЬ: поля, помеченные «← ВПИШИТЕ», нужно заменить реальными
# значениями. Любой плейсхолдер, содержащий «xxxxxxxx», считается НЕзаполненным —
# сервис в этом случае корректно уходит в офлайн-режим (демо-данные/шаблоны),
# поэтому файл рабочий «как есть» и активирует ИИ ровно тогда, когда вы вставите
# настоящие ключи.
# ============================================================================

server:
  host: "0.0.0.0"
  port: 8080
  # Ключ заголовка X-Api-Key на /excel/extract. Тот же ключ — в Dify HTTP-узле.
  api_key: "112233"

excel:
  # Бюджет символов извлечённой таблицы (защита от переполнения 32k токенов).
  max_chars: 60000
  drop_empty_cells: true

# ────────────────────────────────────────────────────────────────────────────
# Dify + ВИЗУАЛЬНАЯ модель (распознавание фото документов)
# ────────────────────────────────────────────────────────────────────────────
dify:
  # База API Dify (без завершающего слэша).
  base_url: "https://dify.t1v.scibox.tech/v1"
  # API-ключ Dify-приложения MAX-ветки (вкладка «API Access»). Формат app-...
  max_app_key: "app-xxxxxxxxxxxxxxxx"            # ← ВПИШИТЕ (или оставьте — офлайн-фолбэк)
  # Эти два ключа нужны ТОЛЬКО если визуальную модель / заполнение ведёте через
  # Dify (vision.provider: dify). При vision.provider: openrouter они не нужны.
  doc_vision_app_key: "app-xxxxxxxxxxxxxxxx"     # не используется при provider: openrouter
  doc_fill_app_key: "app-xxxxxxxxxxxxxxxx"       # ← ВПИШИТЕ (или оставьте — офлайн-фолбэк)
  doc_template_path: "./data/Zayavlenie_Shablon.docx"  # DOCX-шаблон для генерации в Dify
  # API-ключ ассистента «Подбор меры поддержки» (measure_assistant.yml, вкладка
  # «API Access», формат app-...). Используется при подборе меры по фото документов
  # и по тексту запроса. Пусто/плейсхолдер → офлайн-подбор по ключевым словам.
  measure_app_key: "app-xxxxxxxxxxxxxxxx"        # ← ВПИШИТЕ (или оставьте — офлайн-фолбэк)
  # Каталог для DOCX-шаблонов мер поддержки (их грузит админ в веб-кабинете).
  measure_templates_dir: "./data/measure_templates"
  # API-ключ ассистента нормализации «Истории взаимодействия» (history_assistant.yml).
  # Пусто/плейсхолдер → офлайн-нормализатор.
  history_app_key: "app-xxxxxxxxxxxxxxxx"        # ← ВПИШИТЕ (или оставьте — офлайн-фолбэк)

  # ── Визуальная модель: шаг ① «мера поддержки по фото» ──────────────────────
  # Провайдер распознавания документов (паспорт, удостоверение ВБД, квитанция ЕПД):
  #   openrouter — прямой вызов vision-модели через OpenRouter (выбрано ниже);
  #   dify       — Dify-воркфлоу vision_assistant.yml (тогда нужен doc_vision_app_key).
  vision:
    provider: "openrouter"                       # openrouter | dify

    # OpenRouter совместим с OpenAI API (POST {base}/chat/completions).
    openrouter_base_url: "https://openrouter.ai/api/v1"
    # Ключ OpenRouter (https://openrouter.ai/keys). Формат sk-or-v1-...
    openrouter_api_key: "sk-or-v1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"   # ← ВПИШИТЕ
    # МОДЕЛЬ ОБЯЗАТЕЛЬНО С ПОДДЕРЖКОЙ VISION. Рекомендуется:
    #   google/gemini-2.5-flash            (быстрая и дешёвая, хорошее OCR) ← по умолчанию
    #   google/gemini-2.5-pro              (точнее, дороже)
    #   openai/gpt-4o-mini                 (дёшево) / openai/gpt-4o (точнее)
    #   qwen/qwen2.5-vl-72b-instruct       (сильный OCR кириллицы)
    #   anthropic/claude-3.7-sonnet        (качественно, дороже)
    openrouter_model: "google/gemini-2.5-flash"  # ← при желании замените
    temperature: 0.1
    timeout: 90

  # «Заранее выбранная база знаний» — куда операторы дописывают ответы И куда
  # микросервис автосинхронизирует активные меры поддержки (каждая — отдельным
  # документом «Мера поддержки #<id>: …»). ЭТОТ ЖЕ датасет нужно выбрать в Dify
  # в узле knowledge-retrieval ассистента measure_assistant.yml (там сейчас
  # плейсхолдер REPLACE_WITH_MEASURES_DATASET_ID). Отдельного dataset_id для мер нет.
  dataset:
    api_key: "dataset-xxxxxxxxxxxxxxxx"          # ← ВПИШИТЕ (раздел «Knowledge API»)
    dataset_id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"   # ← ВПИШИТЕ (ID из URL базы)

# ────────────────────────────────────────────────────────────────────────────
# MAX-бот
# ────────────────────────────────────────────────────────────────────────────
  # Отдельный Chat/Chatflow и Knowledge Dataset для раздела «Чат с ИИ».
  # Заполните ключи после создания приложения и базы знаний в Dify.
  usvo_ai:
    app_key: ""                                  # ← ключ usvo_chat_assistant.yml (сам чат)
    # API-ключ ассистента-планировщика запросов (usvo_query_assistant.yml, вкладка
    # «API Access», формат app-...). Превращает вопрос в фильтр/агрегат для точного
    # подсчёта по ВСЕМ карточкам (обход лимита 32k). Пусто → офлайн-разбор вопроса.
    planner_app_key: ""                          # ← ВПИШИТЕ (или оставьте — офлайн-фолбэк)
    timeout: 90
    max_history_messages: 30
    auto_sync: true
    dataset:
      api_key: ""
      dataset_id: ""

max:
  api_base_url: "https://platform-api.max.ru"
  bot_token: "xxxxxxxxxxxxxxxxxxxxxxxx"          # ← ВПИШИТЕ (токен от @MasterBot)
  operator_chat_id: "-1001234567890"             # ← ВПИШИТЕ (чат операторов)
  questions_before_offer: 2
  confidence_threshold: 0.6
  topic_threshold: 0.5
  # true → uvicorn сам опрашивает MAX (long polling), вебхук не нужен — удобно для dev.
  # Не включайте вместе с активной подпиской на вебхук.
  polling: false

storage:
  sqlite_path: "./data/state.db"

# ────────────────────────────────────────────────────────────────────────────
# Простая авторизация веб-кабинета: логин и пароль проверяются по demo_users,
# после чего приложение создаёт собственную cookie-сессию.
# ────────────────────────────────────────────────────────────────────────────
auth:
  enabled: true
  mode: "demo"                                   # demo: локальная проверка логина и пароля
  external_name: "Пользователь платформы"
  external_role: "Оператор"
  kratos_public_url: "http://localhost:4433"     # нужен только при mode: kratos
  session_secret: "change-me-please-set-a-long-random-secret"   # ← СМЕНИТЕ на проде
  session_ttl_hours: 12
  # Используются только при mode: demo (вход проверяется по этому списку).
  demo_users:
    - identifier: "operator@mosreg.ru"
      password: "kontakt2026"
      name: "Иванова О. П."
      role: "Оператор"
    - identifier: "admin@mosreg.ru"
      password: "admin2026"
      name: "Петров С. А."
      role: "Администратор"

# ────────────────────────────────────────────────────────────────────────────
# Веб-кабинет «Контакт-центр». Открывается на том же порту: http://<host>:8080/
# ────────────────────────────────────────────────────────────────────────────
web:
  enabled: true
  title: "Контакт-центр — Господдержка СВО"
  usvo_xlsx: "../USVO_tablitsa_1_plus_49_synthetic_rows_dates_addresses_fixed.xlsx"
  kb_text: "../Информация для базы знаний.txt"
  contact_stale_days: 90
  operators:
    - "Иванова О. П."
    - "Петров С. А."
    - "Сидорова М. В."

  # ИИ для веб-черновиков ответа, заметок, тональности/выжимки/уверенности.
  # provider:
  #   local             → без внешнего ИИ (детерминированные шаблоны/правила);
  #   dify              → отдельное Dify-приложение (в т.ч. ветки sentiment/summary/
  #                        confidence из assistant.yml — выбираются по channel);
  #   openai_compatible → любая модель через /chat/completions (в т.ч. OpenRouter).
  ai:
    provider: "local"                            # ← поставьте openai_compatible, чтобы включить ИИ

    # — Вариант «dify» —
    dify_base_url: "https://dify.t1v.scibox.tech/v1"
    dify_app_key: ""                             # ← ВПИШИТЕ при provider: dify
    dify_mode: "auto"                            # auto | chat | completion
    dify_input_variable: "query"

    # — Вариант «openai_compatible» (например, тот же OpenRouter, текстовая модель) —
    # Раскомментируйте/заполните и переключите provider выше на openai_compatible.
    openai_base_url: "https://openrouter.ai/api/v1"
    openai_api_key: "sk-or-v1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"   # ← ВПИШИТЕ
    openai_model: "google/gemini-2.5-flash"      # текстовая или мультимодальная модель

    temperature: 0.2
    timeout: 60
  seed_appeals: true

schedule_file: "./data/schedule.yaml"

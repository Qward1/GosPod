<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <title>Контакт-центр — Господдержка СВО</title>
    <!--
      Базовый префикс для всех относительных ссылок. Сборка идёт с base "./",
      а SPA-маршруты бывают вложенными (/usvo/cards/42) и могут отдаваться
      за reverse-proxy по подпути (/jnserver/1103/application/). Без <base>
      "favicon.svg" на /usvo/cards/42 резолвился бы в /usvo/cards/favicon.svg.

      Скрипт стоит ПЕРВЫМ в <head> и пишет <base> через document.write, чтобы
      тег появился до остального содержимого <head>. Он же кладёт префикс в
      window.__APP_BASE__ — оттуда его берёт плагин runtimeBaseAssets
      (vite.config.ts), который вставляет теги ассетов уже с абсолютным путём.

      Алгоритм — зеркало appBaseFromPath() из src/lib/utils.ts; список
      маршрутов держать синхронным с App.tsx и со списком _SPA_ROUTES
      в app/main.py.
    -->
    <script>
      (function () {
        var SPA_ROUTE_RE =
          /\/(login|cards|ai-chat|applications|analytics|broadcast|audit|settings)(\/.*)?$/;
        function appBaseFromPath(pathname) {
          var base = pathname.replace(/\/+$/, "");
          base = base.replace(/\/(index|login)\.html$/, "");
          base = base.replace(/\/usvo\/cards\/\d+$/, "");
          base = base.replace(SPA_ROUTE_RE, "");
          base = base.replace(/(\/application)+$/, "/application");
          return base;
        }
        window.__APP_BASE__ = appBaseFromPath(window.location.pathname);
        document.write('<base href="' + window.__APP_BASE__ + '/">');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!--
      Тема выставляется ДО первой отрисовки. next-themes в обычном React-SPA
      навешивает класс уже после гидратации, поэтому без этого скрипта тёмная
      тема успевала мигнуть белым на каждой загрузке страницы.
      storageKey и attribute обязаны совпадать с ThemeProvider
      (src/components/theme-provider.tsx): "theme" и class="dark".
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme") || "system";
          var dark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* приватный режим без localStorage — остаёмся на светлой теме */
        }
      })();
    </script>
      <script>
      (function () {
        var b = window.__APP_BASE__ || "";
        var css = ["assets/index-DF3SKKRQ.css"];
        var js = ["assets/index-DW-_nWt-.js"];
        for (var i = 0; i < css.length; i++) {
          document.write('<link rel="stylesheet" crossorigin href="' + b + '/' + css[i] + '">');
        }
        for (var k = 0; k < js.length; k++) {
          document.write('<script type="module" crossorigin src="' + b + '/' + js[k] + '"><\/script>');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Контакт-центр — Господдержка СВО</title>
  <!-- Базовый префикс для всех относительных ссылок: кабинет может отдаваться за
       reverse-proxy по подпути (напр. /jnserver/1103/application/), а также по
       deep-link'у /usvo/cards/<id>. Считаем тем же алгоритмом, что и app.js, и
       выставляем <base>, чтобы styles.css/app.js/medals.js/favicon грузились
       по правильному пути, а не из корня хоста. -->
  <script>
    (function () {
      function appBaseFromPath(pathname) {
        var base = pathname.replace(/\/+$/, "");
        base = base.replace(/\/(index|login)\.html$/, "");
        base = base.replace(/\/usvo\/cards\/\d+$/, "");
        base = base.replace(/(\/application)+$/, "/application");
        return base;
      }
      var base = appBaseFromPath(window.location.pathname);
      document.write('<base href="' + base + '/">');
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- Leaflet: интерактивная карта-heatmap (раздел «Аналитика»). -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css?v=20260709-2" />
  <!-- Тема выставляется ДО отрисовки, чтобы не было мигания при загрузке. -->
  <script>
    (function () {
      try {
        // По умолчанию — тёмная тема (глубокий mesh-фон + стекло).
        document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark";
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    })();
  </script>
</head>
<body>
  <div class="app-bg" aria-hidden="true"></div>

  <div class="layout">
    <!-- ЛЕВАЯ НАВИГАЦИЯ ВО ВСЮ ВЫСОТУ -->
    <aside class="sidebar glass">
      <div class="brand-switch" id="brand-switch">
        <div class="brand brand--static">
          <div class="brand__logo" id="brand-logo">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.4 7.7 8 10 4.6-2.3 8-5 8-10V6l-8-4z"/></svg>
          </div>
          <div class="brand__text">
            <span class="brand__title" id="brand-title">Контакт центр - Рабочее место сотрудника (СВО)</span>
            <span class="brand__sub" id="brand-sub">Господдержка СВО</span>
          </div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav__item active" data-view="appeals">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Обращения</span>
          <em class="nav__badge" id="nav-appeals-count"></em>
        </button>
        <button class="nav__item" data-view="cards">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span id="nav-cards-label">Карточки УСВО</span>
        </button>
        <button class="nav__item" data-view="ai-chat">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a7 7 0 0 0-7 7v1a4 4 0 0 0-2 3.5A3.5 3.5 0 0 0 6.5 18H8l4 3v-3h5.5a3.5 3.5 0 0 0 3.5-3.5A4 4 0 0 0 19 11v-1a7 7 0 0 0-7-7z"/><path d="M9 10h.01M12 10h.01M15 10h.01"/></svg>
          <span>Вопрос-ответ по нормативке</span>
        </button>
        <button class="nav__item" data-view="applications">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13l2 2 4-4"/></svg>
          <span>Заявления</span>
          <em class="nav__badge" id="nav-apps-count"></em>
        </button>
        <button class="nav__item" data-view="analytics">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="7" width="3" height="10"/><rect x="17" y="13" width="3" height="4"/></svg>
          <span>Аналитика</span>
        </button>
        <!-- Виден только администратору (управляется из app.js по роли). -->
        <button class="nav__item nav__item--admin" data-view="broadcast" id="nav-broadcast" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-7-8-3z"/><path d="M11 13l4-4"/></svg>
          <span>Рассылки</span>
        </button>
        <button class="nav__item nav__item--admin" data-view="audit" id="nav-audit" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg>
          <span>Журнал действий</span>
        </button>
        <button class="nav__item nav__item--admin" data-view="settings" id="nav-settings" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Настройки</span>
        </button>
      </nav>

      <div class="sidebar__foot">
        <label class="op-select">
          <span>Сотрудник</span>
          <select id="operator-select"></select>
        </label>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Переключить тему">
          <span class="theme-toggle__track"><span class="theme-toggle__thumb"></span></span>
          <span class="theme-toggle__label" id="theme-toggle-label">Тёмная тема</span>
        </button>
        <div class="user-box" id="user-box" hidden>
          <div class="user-box__id">
            <span class="user-box__avatar" id="user-avatar">—</span>
            <span class="user-box__meta"><b id="user-name">—</b><small id="user-role"></small></span>
          </div>
          <button class="logout-btn" id="logout-btn" type="button" title="Выйти" aria-label="Выйти">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="content">
      <header class="topbar glass">
        <div>
          <h1 id="view-title">Обращения</h1>
          <p id="view-subtitle" class="muted"></p>
        </div>
        <div class="topbar__actions" id="topbar-actions"></div>
      </header>

      <section class="view" id="view-root"></section>
    </main>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО (вспомогательное, для подтверждений) -->
  <div class="modal-overlay" id="modal" hidden>
    <div class="modal glass" role="dialog" aria-modal="true">
      <button class="modal__close" id="modal-close" aria-label="Закрыть">&times;</button>
      <div class="modal__body" id="modal-body"></div>
    </div>
  </div>

  <!-- OFFCANVAS — боковая панель (карточка обращения / заявления) -->
  <div class="drawer-overlay" id="drawer-overlay" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Карточка" hidden>
    <header class="drawer__head">
      <div class="drawer__title">
        <h2 id="drawer-title">—</h2>
        <p class="muted" id="drawer-subtitle"></p>
      </div>
      <button class="drawer__close" id="drawer-close" aria-label="Закрыть">&times;</button>
    </header>
    <div class="drawer__body" id="drawer-body"></div>
    <footer class="drawer__foot" id="drawer-foot"></footer>
  </aside>

  <div class="toast" id="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="medals.js?v=20260621-1"></script>
  <script src="app.js?v=20260721-1"></script>
</body>
</html>

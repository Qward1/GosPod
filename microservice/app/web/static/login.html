<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Вход — Контакт-центр поддержки СВО</title>
  <!-- Базовый префикс для относительных ссылок (см. index.html): кабинет может
       отдаваться за reverse-proxy по подпути. Выставляем <base>, чтобы
       styles.css/favicon грузились по правильному пути, а не из корня хоста. -->
  <script>
    (function () {
      function appBaseFromPath(pathname) {
        var base = pathname.replace(/\/+$/, "");
        base = base.replace(/\/(index|login)\.html$/, "");
        base = base.replace(/(\/application)+$/, "/application");
        return base;
      }
      var base = appBaseFromPath(window.location.pathname);
      document.write('<base href="' + base + '/">');
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css?v=20260620-2" />
  <script>
    (function () {
      try {
        document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark";
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    })();
  </script>
</head>
<body class="login-body">
  <div class="app-bg" aria-hidden="true"></div>

  <main class="login-wrap">
    <section class="login-card glass">
      <div class="login-brand">
        <div class="login-brand__logo">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.4 7.7 8 10 4.6-2.3 8-5 8-10V6l-8-4z"/></svg>
        </div>
        <div class="login-brand__text">
          <b>Контакт-центр</b>
          <span>Господдержка СВО · Московская область</span>
        </div>
      </div>

      <h1 class="login-title">Вход в систему</h1>
      <p class="login-sub">Введите логин и пароль контакт-центра</p>

      <form id="login-form" class="login-form" autocomplete="on">
        <label class="login-field">
          <span>Телефон, почта или СНИЛС</span>
          <input id="identifier" name="identifier" type="text" inputmode="email"
                 placeholder="operator@mosreg.ru" required autofocus />
        </label>
        <label class="login-field">
          <span>Пароль</span>
          <input id="password" name="password" type="password" placeholder="••••••••" required />
        </label>

        <div class="login-error" id="login-error" hidden></div>

        <button class="btn btn--primary login-submit" id="login-submit" type="submit">
          <span>Войти</span>
        </button>
      </form>

      <p class="login-demo" id="login-demo"></p>
    </section>

    <footer class="login-foot">
      Защищённое соединение · © Администрация Ленинского городского округа
    </footer>
  </main>

  <script>
    "use strict";
    function appBaseFromPath(pathname) {
      let base = pathname.replace(/\/+$/, "");
      base = base.replace(/\/(index|login)\.html$/, "");
      base = base.replace(/(\/application)+$/, "/application");
      return base;
    }

    const APP_BASE = appBaseFromPath(window.location.pathname);
    const API = APP_BASE + "/api/web/auth";
    // Явный index.html не даёт внешнему reverse proxy подменить URL каталога
    // (/jnserver/1103/application/) на служебную страницу /not-found.
    const HOME_URL = APP_BASE + "/index.html";
    const $ = (s) => document.querySelector(s);

    function showError(msg) {
      const e = $("#login-error");
      e.textContent = msg; e.hidden = false;
    }
    async function init() {
      // Уже авторизован? — сразу в кабинет.
      try {
        const r = await fetch(API + "/whoami", { credentials: "same-origin" });
        if (r.ok) { location.replace(HOME_URL); return; }
      } catch (_) {}
      try {
        const cfg = await (await fetch(API + "/config")).json();
        if (cfg.mode === "demo") {
          $("#login-demo").innerHTML =
            "Демо-доступ — администратор: <b>admin@mosreg.ru / admin2026</b>, " +
            "сотрудник: <b>operator@mosreg.ru / kontakt2026</b>";
        } else {
          $("#login-demo").textContent = "Авторизация через защищённый сервис учётных записей";
        }
      } catch (_) {}
    }

    $("#login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("#login-error").hidden = true;
      const btn = $("#login-submit");
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span><span>Проверяем…</span>';
      try {
        const res = await fetch(API + "/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            identifier: $("#identifier").value.trim(),
            password: $("#password").value,
          }),
        });
        if (!res.ok) {
          let msg = res.status === 401 ? "Неверный логин или пароль" : "Ошибка авторизации " + res.status;
          try { msg = (await res.json()).detail || msg; } catch (_) {}
          showError(msg);
          btn.disabled = false; btn.innerHTML = "<span>Войти</span>";
          return;
        }
        location.replace(HOME_URL);
      } catch (err) {
        showError("Сервис авторизации недоступен. Повторите попытку.");
        btn.disabled = false; btn.innerHTML = "<span>Войти</span>";
      }
    });

    init();
  </script>
</body>
</html>

app:
  description: 'Планировщик запросов «Чата с ИИ» по карточкам УСВО. На вход — вопрос
    пользователя (sys.query), на выходе — строгий JSON QuerySpec, описывающий выборку/счёт/
    агрегат по базе карточек. Микросервис исполняет этот QuerySpec детерминированно по ВСЕМ
    карточкам (обходит лимит модели в 32k токенов), а не отдаёт 1500 карточек в контекст.
    Подключается к микросервису как dify.usvo_ai.planner_app_key (app/web/usvo_query.py::plan_query).
    Базы знаний НЕ требует. Если ключ не задан — микросервис разбирает вопрос офлайн-эвристикой.
    См. CLAUDE.md.'
  icon: 🧭
  icon_background: '#EFF6FF'
  mode: advanced-chat
  name: Планировщик запросов по карточкам УСВО (Господдержка СВО)
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: package
  value:
    plugin_unique_identifier: langgenius/openai_api_compatible:0.0.35@bb81bce2b7e04af8178eb2fb36cc6e1eb75aadbc98d31bc2c858b4648ba63c26
    version: null
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start_node-source-plan_llm-target
      source: start_node
      sourceHandle: source
      target: plan_llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: plan_llm-source-answer_node-target
      source: plan_llm
      sourceHandle: source
      target: answer_node
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 'На вход — вопрос пользователя (sys.query). Передаёт микросервис
          (app/web/usvo_query.py::plan_query). Полная инструкция планировщика уже в query.'
        selected: false
        title: Start
        type: start
        variables: []
      height: 90
      id: start_node
      position: {x: 80, y: 282}
      positionAbsolute: {x: 80, y: 282}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 'Превращает вопрос в QuerySpec (строгий JSON). База знаний не нужна — это
          только классификация запроса в структуру фильтров/агрегата.'
        model:
          completion_params: {temperature: 0}
          mode: chat
          name: qwen3-32b-fp8-v2
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: plan-sys
          role: system
          text: |
            Ты — планировщик запросов по базе карточек УСВО (участники СВО). Преврати вопрос пользователя в JSON-объект QuerySpec строго по схеме. Никакого текста вне JSON, без markdown.

            Поля:
            - intent: "list" (перечислить), "count" (сколько/число), "aggregate" (разбивка/статистика), "lookup" (о конкретном человеке по ФИО), "semantic" (свободный смысловой вопрос — тогда ВСЕ фильтры пустые).
            - status, locality, awards_contains, name_query, field_label, field_value: строки-подстроки для поиска (или "").
            - gender: "м" | "ж" | ""; disability: "yes" | "no" | "".
            - age_min, age_max, limit: целые > 0; 0 если не задано.
            - flags: подмножество ["vbd","unemployed","stale_contact","support_need","org","awards","directive"] (ветеран боевых действий; нуждается в трудоустройстве; давно без связи; нужны меры поддержки; участвует в организациях; имеет награды; есть поручение Главы округа).
            - sort: "age_desc" | "age_asc" | "name" | "".
            - aggregate_by: "status" | "locality" | "gender" | "age" | "disability" | "awards" (только для intent="aggregate").

            Если вопрос не про выборку/счёт/статистику по базе — intent="semantic" и все фильтры пустые.
        - id: plan-user
          role: user
          text: |
            {{#sys.query#}}
        selected: false
        structured_output:
          schema:
            type: object
            additionalProperties: false
            required:
            - intent
            properties:
              intent:
                type: string
                enum: [list, count, aggregate, lookup, semantic]
              status: {type: string}
              locality: {type: string}
              awards_contains: {type: string}
              gender: {type: string}
              disability: {type: string}
              name_query: {type: string}
              field_label: {type: string}
              field_value: {type: string}
              sort: {type: string}
              aggregate_by: {type: string}
              age_min: {type: integer}
              age_max: {type: integer}
              limit: {type: integer}
              flags:
                type: array
                items: {type: string}
        structured_output_enabled: true
        title: Планировщик (LLM)
        type: llm
      height: 98
      id: plan_llm
      position: {x: 384, y: 282}
      positionAbsolute: {x: 384, y: 282}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#plan_llm.text#}}'
        desc: Возвращает JSON QuerySpec микросервису (plan_query).
        selected: false
        title: Ответ (JSON QuerySpec)
        type: answer
        variables: []
      height: 106
      id: answer_node
      position: {x: 688, y: 282}
      positionAbsolute: {x: 688, y: 282}
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1

app:
  description: Ассистент-заполнитель заявления о назначении ежемесячной денежной компенсации расходов
    на оплату ЖКУ. Вход — JSON визуальной модели; генерирует .docx по шаблону Zayavlenie_Shablon.docx
    плагином document-generator. Подключается к микросервису как dify.doc_fill_app_key.
  icon: 📝
  icon_background: '#E0F2FE'
  mode: advanced-chat
  name: Заполнение заявления (Господдержка СВО)
  use_icon_as_answer_icon: false

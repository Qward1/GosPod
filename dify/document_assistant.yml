      zIndex: 0
    nodes:
    - data:
        desc: 'На вход: JSON, извлечённый визуальной моделью (шаг ①, см. PROMPTS.md), приходит в сообщение
          чата (sys.query). template — DOCX-шаблон заявления Zayavlenie_Shablon.docx (загружается файлом
          сообщения).'
        selected: false
        title: Start
        type: start
        variables:
        - allowed_file_extensions:
          - .docx
          allowed_file_types:
          - document
          allowed_file_upload_methods:
          - local_file
          - remote_url
          default: ''
          hint: DOCX-шаблон заявления (Zayavlenie_Shablon.docx).
          label: Шаблон заявления
          max_length: 48
          options: []
          placeholder: ''
          required: false
          type: file
          variable: template
      height: 116
      id: start_node
      position:
        x: 60
        y: 282
      positionAbsolute:
        x: 60
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Нормализует и дозаполняет поля заявления. Возвращает строго JSON по схеме.
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: qwen3-32b-fp8-v2
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: fill-sys
          role: system
          text: 'Ты — ассистент-делопроизводитель контакт-центра поддержки участников СВО Ленинского городского
            округа Московской области. На вход (в сообщении) приходит JSON с данными, распознанными по
            фотографиям документов заявителя.


            Подготовь данные для «Заявления о назначении ежемесячной денежной компенсации расходов по
            оплате жилого помещения и коммунальных услуг отдельным категориям граждан, имеющим место жительства
            в Московской области» (форма Минсоцразвития МО).


            Правила:

            - проверь и нормализуй поля: ФИО с заглавных букв, даты в формате ДД.ММ.ГГГГ, телефон в формате
            +7 ...;

            - если основание не указано, но заявитель — участник СВО / имеет удостоверение ВБД, проставь
            категорию «Ветеран боевых действий (участник СВО)», код 061;

            - НЕ выдумывай паспортные данные, номера счетов и адреса. Чего нет на входе — оставь пустой
            строкой "" и перечисли в массиве missing по-русски;

            - верни строго JSON по заданной схеме.'
        - id: fill-user
          role: user
          text: '{{#sys.query#}}'
        selected: false
        structured_output:
          schema:
            type: object
            additionalProperties: false
            required:
            - measure_key
            - measure_title
            - category
            - category_code
            - department
            - applicant
            - ownership
            - rooms
            - family
            - providers
            - payment
            - missing
            - confidence
            - summary_note
            properties:
              measure_key:
                type: string
                description: Ключ меры, напр. zhku_compensation
              measure_title:
                type: string
                description: Название меры поддержки
              category:
                type: string
                description: Льготная категория (основание)
              category_code:
                type: string
                description: Код льготной категории, напр. 061
              department:
                type: string
                description: Наименование ТСП Минсоцразвития МО
              applicant:
                type: object
                additionalProperties: false
                required:
                - fio
                - birth_date
                - passport_series
                - passport_number
                - passport_issued
                - address
                - phone
                - email
                properties:
                  fio:
                    type: string
                  birth_date:
                    type: string
                    description: ДД.ММ.ГГГГ
                  passport_series:
                    type: string
                  passport_number:
                    type: string
                  passport_issued:
                    type: string
                    description: кем и когда выдан
                  address:
                    type: string
                  phone:
                    type: string
                  email:
                    type: string
              ownership:
                type: string
                enum:
                - частное
                - муниципальное
                - государственное
              rooms:
                type: string
              family:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - fio
                  - birth_date
                  - relation
                  properties:
                    fio:
                      type: string
                    birth_date:
                      type: string
                    relation:
                      type: string
              providers:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - name
                  - account
                  properties:
                    name:
                      type: string
                    account:
                      type: string
              payment:
                type: object
                additionalProperties: false
                required:
                - method
                - bank
                - account
                properties:
                  method:
                    type: string
                    enum:
                    - bank
                    - post
                  bank:
                    type: string
                  account:
                    type: string
              missing:
                type: array
                items:
                  type: string
              confidence:
                type: number
                minimum: 0
                maximum: 1
              summary_note:
                type: string
        structured_output_enabled: true
        title: Заполнение заявления (LLM)
        type: llm
        vision:
          enabled: false
      height: 98
      id: fill_llm
      position:
        x: 360
        y: 282
      positionAbsolute:
        x: 360
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\nfrom datetime import datetime\n\ndef main(payload):\n    try:\n        d =\
          \ json.loads(payload) if isinstance(payload, str) else (payload or {})\n    except Exception:\n\
          \        d = {}\n    ap = d.get('applicant') or {}\n    rep = d.get('representative') or {}\n\
          \    fam = d.get('family') or []\n    prov = d.get('providers') or []\n    pay = d.get('payment')\
          \ or {}\n    today = datetime.now().strftime('%d.%m.%Y')\n    g = lambda o, k: '' if o.get(k)\
          \ in (None, '') else str(o.get(k))\n    cat = g(d, 'category') or 'Ветеран боевых действий (участник\
          \ СВО)'\n    code = g(d, 'category_code') or '061'\n    is_bank = (pay.get('method') or 'bank')\
          \ != 'post'\n    v = {\n        'department': g(d, 'department'),\n        'applicant_fio':\
          \ g(ap, 'fio'),\n        'applicant_birth_date': g(ap, 'birth_date'),\n        'passport_series':\
          \ g(ap, 'passport_series'),\n        'passport_number': g(ap, 'passport_number'),\n        'passport_issued':\
          \ g(ap, 'passport_issued'),\n        'applicant_address': g(ap, 'address'),\n        'representative_fio':\
          \ g(rep, 'fio'),\n        'rep_passport_series': g(rep, 'passport_series'),\n        'rep_passport_number':\
          \ g(rep, 'passport_number'),\n        'rep_passport_issued': g(rep, 'passport_issued'),\n  \
          \      'representative_authority': g(rep, 'authority'),\n        'rooms': g(d, 'rooms'),\n \
          \       'house_code': code, 'house_category': cat, 'house_start': today, 'house_end': '',\n\
          \        'capital_code': '', 'capital_category': '', 'capital_start': '', 'capital_end': '',\n\
          \        'comm_code': code, 'comm_category': cat, 'comm_start': today, 'comm_end': '',\n   \
          \     'phone_home': g(ap, 'phone_home'),\n        'phone_mobile': g(ap, 'phone'),\n        'email':\
          \ g(ap, 'email'),\n        'sign_fio': g(ap, 'fio'),\n        'sign_date': today,\n        'payment_bank':\
          \ g(pay, 'bank') if is_bank else '',\n        'payment_account': g(pay, 'account') if is_bank\
          \ else '',\n        'pay_bank_mark': 'V' if is_bank else '',\n        'pay_post_mark': '' if\
          \ is_bank else 'V',\n    }\n    for i in range(1, 3):\n        m = fam[i-1] if i-1 < len(fam)\
          \ else {}\n        nm = g(m, 'fio')\n        bd = g(m, 'birth_date')\n        v['family_%d_fio'\
          \ % i] = (nm + (', ' + bd if bd else '')).strip(', ')\n        v['family_%d_relation' % i] =\
          \ g(m, 'relation')\n    for i in range(1, 5):\n        p = prov[i-1] if i-1 < len(prov) else\
          \ {}\n        v['provider_%d_name' % i] = g(p, 'name')\n        v['provider_%d_account' % i]\
          \ = g(p, 'account')\n    return {'docx_variables': json.dumps(v, ensure_ascii=False)}\n"
        code_language: python3
        desc: Раскладывает JSON LLM в плоский набор {{плейсхолдеров}} шаблона (см. PROMPTS.md). Выдаёт
          docx_variables — JSON-строку для document-generator.
        outputs:
          docx_variables:
            children: null
            type: string
        selected: false
        title: Переменные заявления
        type: code
        variables:
        - value_selector:
          - fill_llm
          - text
          value_type: string
          variable: payload
      height: 54

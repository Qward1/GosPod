<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Контакт-центр — Господдержка СВО</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- Leaflet: интерактивная карта-heatmap (раздел «Аналитика»). -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Тема выставляется ДО отрисовки, чтобы не было мигания при загрузке. -->
  <script>
    (function () {
      try {
        // По умолчанию — тёмная тема (глубокий mesh-фон + стекло).
        document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark";
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    })();
  </script>
</head>
<body>
  <div class="app-bg" aria-hidden="true"></div>

  <div class="layout">
    <!-- ЛЕВАЯ НАВИГАЦИЯ ВО ВСЮ ВЫСОТУ -->
    <aside class="sidebar glass">
      <div class="brand">
        <div class="brand__logo">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.4 7.7 8 10 4.6-2.3 8-5 8-10V6l-8-4z"/></svg>
        </div>
        <div class="brand__text">
          <span class="brand__title">Контакт-центр</span>
          <span class="brand__sub">Господдержка СВО</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav__item active" data-view="appeals">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Обращения</span>
          <em class="nav__badge" id="nav-appeals-count"></em>
        </button>
        <button class="nav__item" data-view="cards">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Карточки УСВО</span>
        </button>
        <button class="nav__item" data-view="applications">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13l2 2 4-4"/></svg>
          <span>Заявления</span>
          <em class="nav__badge" id="nav-apps-count"></em>
        </button>
        <button class="nav__item" data-view="analytics">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="7" width="3" height="10"/><rect x="17" y="13" width="3" height="4"/></svg>
          <span>Аналитика</span>
        </button>
      </nav>

      <div class="sidebar__foot">
        <label class="op-select">
          <span>Сотрудник</span>
          <select id="operator-select"></select>
        </label>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Переключить тему">
          <span class="theme-toggle__track"><span class="theme-toggle__thumb"></span></span>
          <span class="theme-toggle__label" id="theme-toggle-label">Тёмная тема</span>
        </button>
        <div class="status-pill" id="mode-pill"></div>
        <div class="user-box" id="user-box" hidden>
          <div class="user-box__id">
            <span class="user-box__avatar" id="user-avatar">—</span>
            <span class="user-box__meta"><b id="user-name">—</b><small id="user-role"></small></span>
          </div>
          <button class="logout-btn" id="logout-btn" type="button" title="Выйти" aria-label="Выйти">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="content">
      <header class="topbar glass">
        <div>
          <h1 id="view-title">Обращения</h1>
          <p id="view-subtitle" class="muted"></p>
        </div>
        <div class="topbar__actions" id="topbar-actions"></div>
      </header>

      <section class="view" id="view-root"></section>
    </main>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО (вспомогательное, для подтверждений) -->
  <div class="modal-overlay" id="modal" hidden>
    <div class="modal glass" role="dialog" aria-modal="true">
      <button class="modal__close" id="modal-close" aria-label="Закрыть">&times;</button>
      <div class="modal__body" id="modal-body"></div>
    </div>
  </div>

  <!-- OFFCANVAS — боковая панель (карточка обращения / заявления) -->
  <div class="drawer-overlay" id="drawer-overlay" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Карточка" hidden>
    <header class="drawer__head">
      <div class="drawer__title">
        <h2 id="drawer-title">—</h2>
        <p class="muted" id="drawer-subtitle"></p>
      </div>
      <button class="drawer__close" id="drawer-close" aria-label="Закрыть">&times;</button>
    </header>
    <div class="drawer__body" id="drawer-body"></div>
    <footer class="drawer__foot" id="drawer-foot"></footer>
  </aside>

  <div class="toast" id="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="medals.js"></script>
  <script src="app.js"></script>
</body>
</html>

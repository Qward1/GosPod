<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Контакт-центр поддержки СВО</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      try {
        document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark";
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    })();
  </script>
</head>
<body class="login-body">
  <div class="app-bg" aria-hidden="true"></div>

  <main class="login-wrap">
    <section class="login-card glass">
      <div class="login-brand">
        <div class="login-brand__logo">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.4 7.7 8 10 4.6-2.3 8-5 8-10V6l-8-4z"/></svg>
        </div>
        <div class="login-brand__text">
          <b>Контакт-центр</b>
          <span>Господдержка СВО · Московская область</span>
        </div>
      </div>

      <h1 class="login-title">Вход в систему</h1>
      <p class="login-sub">Войдите через единую учётную запись контакт-центра</p>

      <form id="login-form" class="login-form" autocomplete="on">
        <label class="login-field">
          <span>Телефон, почта или СНИЛС</span>
          <input id="identifier" name="identifier" type="text" inputmode="email"
                 placeholder="operator@mosreg.ru" required autofocus />
        </label>
        <label class="login-field">
          <span>Пароль</span>
          <input id="password" name="password" type="password" placeholder="••••••••" required />
        </label>

        <div class="login-error" id="login-error" hidden></div>

        <button class="btn btn--primary login-submit" id="login-submit" type="submit">
          <span>Войти</span>
        </button>
      </form>

      <div class="login-links">
        <a href="#" id="forgot">Не удаётся войти?</a>
        <a href="#" id="register">Зарегистрироваться</a>
      </div>

      <div class="login-divider"><span>или</span></div>
      <button class="login-esia" type="button" id="esia-btn">
        <span class="login-esia__badge">ЕСИА</span>
        <span>Войти через Госуслуги (ЕСИА)</span>
      </button>

      <p class="login-demo" id="login-demo"></p>
    </section>

    <footer class="login-foot">
      Защищённое соединение · © Администрация Ленинского городского округа
    </footer>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script>
    "use strict";
    const API = window.location.pathname.replace(/login\.html$/, "").replace(/\/$/, "") + "/api/web/auth";
    const $ = (s) => document.querySelector(s);

    function showError(msg) {
      const e = $("#login-error");
      e.textContent = msg; e.hidden = false;
    }
    function toast(msg) {
      const t = $("#toast"); t.textContent = msg; t.hidden = false;
      setTimeout(() => (t.hidden = true), 2600);
    }

    async function init() {
      // Уже авторизован? — сразу в кабинет.
      try {
        const r = await fetch(API + "/whoami", { credentials: "same-origin" });
        if (r.ok) { location.replace("./"); return; }
      } catch (_) {}
      try {
        const cfg = await (await fetch(API + "/config")).json();
        if (cfg.mode === "demo") {
          $("#login-demo").innerHTML =
            "Демо-доступ: <b>operator@mosreg.ru / kontakt2026</b> или <b>admin@mosreg.ru / admin2026</b>";
        } else {
          $("#login-demo").textContent = "Авторизация через защищённый сервис учётных записей";
        }
      } catch (_) {}
    }

    $("#login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("#login-error").hidden = true;
      const btn = $("#login-submit");
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span><span>Проверяем…</span>';
      try {
        const res = await fetch(API + "/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            identifier: $("#identifier").value.trim(),
            password: $("#password").value,
          }),
        });
        if (!res.ok) {
          let msg = "Неверный логин или пароль";
          try { msg = (await res.json()).detail || msg; } catch (_) {}
          showError(msg);
          btn.disabled = false; btn.innerHTML = "<span>Войти</span>";
          return;
        }
        location.replace("./");
      } catch (err) {
        showError("Сервис авторизации недоступен. Повторите попытку.");
        btn.disabled = false; btn.innerHTML = "<span>Войти</span>";
      }
    });

    $("#esia-btn").addEventListener("click", () =>
      toast("Вход через внешнюю ЕСИА подключается на проде. Используйте учётную запись контакт-центра."));
    $("#forgot").addEventListener("click", (e) => { e.preventDefault(); toast("Обратитесь к администратору контакт-центра."); });
    $("#register").addEventListener("click", (e) => { e.preventDefault(); toast("Учётные записи создаёт администратор контакт-центра."); });

    init();
  </script>
</body>
</html>
